defaults:
  - GradDiff

handler: SimNPO

# Defaults below are the best-aggregate point of the 48-model SimNPO grid from
# open-unlearning's TOFU Unlearned Models collection, i.e.
#   unlearn_tofu_Llama-3.2-1B-Instruct_forget10_SimNPO_lr5e-05_b3.5_a1_d1_g0.125_ep10
# scoring aggregate 0.7054 (memorization 0.610 / privacy 0.842 / utility 0.701)
# on TOFU forget10 with privleak -1.33 -- the best MIA calibration in the grid.
# See saves/grid/results/report.md; regenerate with saves/grid/grid_summarizer.py.
#
# The previous defaults (delta 0.0, beta 4.5) sat in the grid's bottom quartile:
# delta=0 averages 0.131 aggregate against delta=1's 0.469, because without the
# margin the forget set stays MIA-detectable (privleak <= -95).
#
# CAUTION -- learning_rate below is the *trainer-group* default only. Both
# configs/experiment/unlearn/tofu/default.yaml (a _global_ package, so it wins
# over this file) and scripts/run_tofu_weight_baselines.sh pin lr to 1e-5, and
# lr is the grid's second-strongest knob (5e-05 -> 0.458 mean aggregate vs
# 1e-05 -> 0.099). To actually train at the grid's best point, pass
# `trainer.args.learning_rate=5e-05` on the command line. The method_args below
# are not overridden anywhere, so those do take effect as written.
args:
  num_train_epochs: 10
  learning_rate: 5e-05

method_args:
  delta: 1.0 # gamma in https://github.com/OPTML-Group/Unlearn-Simple/blob/main/TOFU/config/forget.yaml
  beta: 3.5
  alpha: 1.0
  gamma: 0.125 # npo_coeff in https://github.com/OPTML-Group/Unlearn-Simple/blob/main/TOFU/config/forget.yaml
  retain_loss_type: NLL

